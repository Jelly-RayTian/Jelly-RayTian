name: Update contribution statistics

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write   # only to commit the regenerated files to this repo; all API calls are GET

concurrency:
  group: update-contributions
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh statistics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_stats.py
      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md OPEN_SOURCE_CONTRIBUTIONS.md data/prs.json
          git commit -m "chore: refresh contribution statistics"
          git push
